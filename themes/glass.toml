# tidings theme: Glass
#
# The default look, and a reference for every setting a theme can make:
# each key below is written out at its default. A theme only needs the keys
# it changes; anything left out keeps the value shown here.
#
# Opacities run from 0 (invisible) to 1 (solid). Sizes are logical pixels.
# Colours are "#rrggbb" or a slot of the current colour scheme, which then
# follows Noctalia: surface, surface_variant, on_surface, on_surface_variant,
# primary, on_primary, error, outline, or tint (on_surface in dark mode,
# white in light mode; lightens whatever it sits on).
#
# Blur is done by Hyprland, which skips pixels below a layer rule's
# ignore_alpha (see hypr/config/layerrules.lua). With blur on, keep the
# toast opacity above that threshold and the shadow opacity below it.

name = "Glass"
description = "Frosted, translucent and pill-shaped, like the macOS Notification Centre."

[font]
# family = "Inter"      # unset: the system UI font
scale = 1.0             # multiplies every text size (0.75 to 1.5)
line_height = 1.3       # line spacing as a multiple of the text size (1 to 2)

[palette]
# Colours that replace those from colors.json. Unset ones follow it.
# mode = "dark"         # "dark" or "light"; light makes `tint` white
# surface = "#18181d"
# surface_variant = "#22232a"
# on_surface = "#e4e1e7"
# on_surface_variant = "#a3abbd"
# primary = "#a8c7fa"
# on_primary = "#0b0e13"
# error = "#d3453b"
# on_error = "#ffffff"
# outline = "#a0b2d2"

[panel]
# opacity = 0.62        # unset: surfaceAlpha from colors.json
radius = 20             # 0 to 40
border_width = 1        # 0 to 4; 0 draws no border
border_color = "outline"
border_opacity = 0.35
blur = true

[card]
radius = 28             # the most a card is rounded; short cards are pills
color = "tint"
opacity = 0.075
hover_opacity = 0.11
border_width = 1
border_color = "tint"
border_opacity = 0.06

[toast]
radius = 29             # 29 makes a collapsed toast a full pill
color = "surface"
opacity = 0.46
hover_opacity = 0.54
expanded_opacity = 0.5
sheen = 0.04            # lightening tint on a hovered or expanded toast
border_width = 1
border_color = "tint"
border_opacity = 0.16
blur = true

[shadow]
# The toasts' drop shadow. size + offset must be at most 12.
color = "#000000"
opacity = 0.28          # 0 to 0.6; 0 draws no shadow
size = 9                # how far it fades out beyond the toast
offset = 3              # how far it is shifted down

[button]
radius = 14             # 14 makes buttons full pills
color = "tint"
opacity = 0.1
hover_opacity = 0.17
