name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # libxkbcommon/libwayland for the UI crate; dbus-daemon for the
        # integration tests (they start a private bus, never a session bus).
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev dbus dash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: sh tests/colors.sh
