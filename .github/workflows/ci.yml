name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The UI's end-to-end tests fail rather than skip without a compositor.
  TIDINGS_REQUIRE_COMPOSITOR: "1"

jobs:
  commits:
    # Releases are derived from commit messages, so every commit since the last
    # release must be a Conventional Commit (feat:, fix:, refactor:, ...).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-cog
      - run: cog check --from-latest-tag

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        # libxkbcommon/libwayland for the UI crate; dbus-daemon for the
        # integration tests (they start a private bus, never a session bus).
        # sway, wtype, wl-clipboard and grim for the UI's end-to-end tests
        # (a private headless compositor).
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev dbus dash sway wtype wl-clipboard grim
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release-build:
    # Releases are built on the oldest supported Ubuntu so they run on it
    # and everything newer (see release.yml); make sure that still works.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p tidings
      - name: The binary runs, and the installer installs it
        run: |
          target/release/tidings --version
          dist=$(mktemp -d)
          cp target/release/tidings install.sh "$dist/"
          PREFIX="$dist/prefix" XDG_DATA_HOME="$dist/data" sh "$dist/install.sh"
          "$dist/prefix/bin/tidings" --version
          PREFIX="$dist/prefix" XDG_DATA_HOME="$dist/data" sh "$dist/install.sh" --uninstall
          test ! -e "$dist/prefix/bin/tidings"
