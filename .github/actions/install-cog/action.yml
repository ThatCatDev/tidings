name: install cocogitto
description: Install a pinned, checksum-verified cocogitto (`cog`) release binary.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COG_VERSION: "7.0.0"
        COG_SHA256: "e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb"
      run: |
        set -euo pipefail
        tarball="cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSLo "$RUNNER_TEMP/$tarball" \
          "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/${tarball}"
        echo "${COG_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/cog"
        tar xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/cog" --strip-components=1
        echo "$RUNNER_TEMP/cog" >> "$GITHUB_PATH"
